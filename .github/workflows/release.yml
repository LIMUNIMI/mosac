name: Build and Release mosac for MacOS
# triggers rebuild on <git commit -m "[RELEASE] vn.n.n"> executed on main branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    if: contains(github.event.head_commit.message, '[RELEASE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configurazione Go env from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Dependencies
        run: |
          go mod download
          go mod verify

      - name: Version (from commit message)
        id: extract_version
        run: |
          EXTRACTED_VERSION=$(echo "${{ github.event.head_commit.message }}" \vert{} grep -oP 'v\d+\.\d+\.\d+' \vert{}\vert{} echo "v0.0.0-${GITHUB_SHA::7}")
          echo "VERSION=$EXTRACTED_VERSION" >> $GITHUB_ENV

      - name: MacOS compilation
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w" -o mosac cmd/mosac/main.go

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            MacOS (arm64) native binary.
            **Commit trigger:** `${{ github.event.head_commit.message }}`
          files: |
            mosac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}